version: '3.8'

services:
  bifrost-proxy:
    build: .
    container_name: bifrost-proxy
    ports:
      - "8182:8080"
    environment:
      # Trỏ tới MinIO của Data Platform
      - S3_ENDPOINT=minio:9000
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
    networks:
      - data_platform_default

networks:
  data_platform_default:
    external: true
